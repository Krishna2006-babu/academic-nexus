name: academic_nexus
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core and Services
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.4.10
  firebase_auth: ^5.7.0

  # File handling for Subject Notes & Vault (PDFs, Images, Links)
  file_picker: ^11.0.2
  image_picker: ^1.2.2
  url_launcher: ^6.3.1

  # UI Dashboard Components & Graphs
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3

  # Smart scheduling reminders & Utilities
  flutter_local_notifications: ^17.0.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env